<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>AccesClass — Vista estudiante</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f4f8; padding: 20px; }

    h1 { color: #1F4E79; margin-bottom: 4px; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 20px; }

    #status { 
      display: inline-block; padding: 6px 14px; border-radius: 20px; 
      font-size: 13px; font-weight: bold; margin-bottom: 16px;
      background: #E2EFDA; color: #375623;
    }

    /* Texto del coordinador */
    .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card-label { font-size: 11px; color: #888; font-weight: bold; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    #texto { font-size: 22px; color: #1F4E79; min-height: 60px; }

    /* Frases rápidas */
    .frases-titulo { font-size: 13px; color: #888; font-weight: bold; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
    .frases-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .frase-btn {
      background: white; border: 2px solid #D6E4F0; border-radius: 10px;
      padding: 14px 12px; font-size: 14px; color: #1F4E79;
      cursor: pointer; text-align: center; transition: all 0.15s;
      line-height: 1.3;
    }
    .frase-btn:hover { background: #1F4E79; color: white; border-color: #1F4E79; }
    .frase-btn:active { transform: scale(0.97); }
    .frase-btn.hablando { background: #E2EFDA; border-color: #5DCAA5; color: #04342C; }
  </style>
</head>
<body>

  <h1>AccesClass</h1>
  <p class="subtitle">Vista del estudiante</p>
  <div id="status">🟢 Conectado</div>

  <!-- Lo que dice el coordinador -->
  <div class="card">
    <div class="card-label">📢 El coordinador dice:</div>
    <div id="texto">Esperando al coordinador...</div>
  </div>

  <!-- Panel de frases rápidas -->
  <div class="card">
    <div class="frases-titulo">💬 Mis frases rápidas — toca para hablar</div>
    <div class="frases-grid" id="frases"></div>
  </div>

  <script>
    // ── WebSocket ──────────────────────────────────
    const texto = document.getElementById('texto');
    const status = document.getElementById('status');
    const socket = new WebSocket("ws://localhost:8000/ws");

    socket.onopen = () => status.textContent = '🟢 Conectado';
    socket.onmessage = (event) => texto.textContent = event.data;
    socket.onclose = () => {
      status.textContent = '🔴 Desconectado';
      status.style.background = '#FCE4D6';
      status.style.color = '#833C00';
    };

    // ── Frases rápidas ────────────────────────────
    const frases = [
      "No entendí, ¿puede repetir?",
      "Tengo una pregunta",
      "¿Puede escribirlo?",
      "Entendí, gracias",
      "Necesito ayuda con mi malla",
      "¿Cuándo es el plazo?",
      "¿Dónde debo ir?",
      "Muchas gracias, hasta luego",
    ];

    const grid = document.getElementById('frases');

    frases.forEach(frase => {
      const btn = document.createElement('button');
      btn.className = 'frase-btn';
      btn.textContent = frase;
      btn.onclick = () => hablar(frase, btn);
      grid.appendChild(btn);
    });

    // ── Text to Speech ────────────────────────────
    function hablar(texto, btn) {
      // Cancela si ya está hablando
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'es-CL';
      utterance.rate = 0.95;

      btn.classList.add('hablando');
      utterance.onend = () => btn.classList.remove('hablando');

      window.speechSynthesis.speak(utterance);
    }
  </script>

</body>
</html>
